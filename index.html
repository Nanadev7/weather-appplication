<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-frame">
    <!-- Top Bar -->
    <div class="top-bar">
      <span>09:41</span>
      <span>📶 📡 🔋</span>
    </div>

    <!-- Search Section -->
    <header class="search-box">
      <input type="text" id="city-input" placeholder="Search any city worldwide...">
      <button id="search-btn">🔍</button>
    </header>

    <!-- Hero Card -->
    <main class="hero-card">
      <div class="hero-top">
        <div>
          <h1 id="city-name">--</h1>
          <p id="country-name" class="country">--</p>
        </div>
        <div id="weather-emoji" class="weather-badge">☀️</div>
      </div>

      <div class="temp-group">
        <span id="current-temp">--</span><span class="deg">°C</span>
      </div>

      <p id="weather-desc" class="condition">Loading...</p>

      <!-- Metrics -->
      <div class="metrics-grid">
        <div class="metric-card">
          <span class="label">Feels Like</span>
          <span id="feels-like" class="val">--</span>
        </div>
        <div class="metric-card">
          <span class="label">Humidity</span>
          <span id="humidity-val" class="val">--</span>
        </div>
        <div class="metric-card">
          <span class="label">Wind</span>
          <span id="wind-val" class="val">--</span>
        </div>
      </div>
    </main>

    <!-- Dynamic 7-Day Forecast Container -->
    <section class="forecast-section">
      <div class="forecast-header">
        <h3>7-Day Forecast</h3>
      </div>
      <div id="forecast-list" class="forecast-list"></div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
