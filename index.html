<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NANA'S Weather App</title>

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="app-container">
    <!-- Top Header -->
    <header class="top-bar">
      <div class="location-info">
        <h2 id="city-name">Abuja NG</h2>
        <p id="current-date">Loading date...</p>
      </div>
    </header>

    <!-- Search Input -->
    <section class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="city-input" placeholder="Search city (e.g. Lagos, Abuja, Port Harcourt)..." tabindex="1" />
    </section>

    <!-- Main Current Temp Card -->
     <!-- hero-card Shows the prominent temperature (#current-temp),
      condition text (#weather-desc), and weather icon (#hero-icon). -->
    <section class="hero-card">
      <div class="hero-details">
        <div class="hero-temp" id="current-temp">--°C</div>
        <p id="weather-desc">Loading weather...</p>
      </div>
      <div class="hero-icon" id="hero-icon">
        <i class="fa-solid fa-cloud-sun"></i>
      </div>
    </section>

    <!-- Quick Stats Grid -->
    <section class="stats-grid">
      <div class="stat-card">
        <i class="fa-solid fa-wind"></i>
        <span>Wind</span>
        <strong id="wind-speed">-- km/h</strong>
      </div>
      <div class="stat-card">
        <i class="fa-solid fa-droplet"></i>
        <span>Humidity</span>
        <strong id="humidity">--%</strong>
      </div>
      <div class="stat-card">
        <i class="fa-solid fa-cloud-rain"></i>
        <span>Precipitation</span>
        <strong id="precipitation">-- mm</strong>
      </div>
    </section>

    <!-- 7-Day Forecast -->
    <section class="weekly-section">
      <h3 class="section-title">7-Day Weekly Report</h3>
      <div class="weekly-list" id="weekly-list">
        <!-- Generated via JS -->
      </div>
    </section>

    
  </main>

  <!-- Custom JavaScript -->
  <script src="script.js"></script>
</body>
</html>
